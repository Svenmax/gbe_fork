name: "Emu PR"

on:
  pull_request:
    branches: ["dev"]
    paths-ignore:
      - "**/*.md"
      - "dev.notes/**"
      - "post_build/**"
      - "z_original_repo_files/**"
      - "sdk/*.txt"
      - "LICENSE"
      # tools
      - "tools/generate_emu_config/**"
      - "tools/migrate_gse/**"
      - "tools/steamclient_loader/linux/**" # these are just scripts, not built
  push:
    branches: ["dev"]
    paths-ignore:
      - "**/*.md"
      - "dev.notes/**"
      - "post_build/**"
      - "z_original_repo_files/**"
      - "sdk/*.txt"
      - "LICENSE"
      # tools
      - "tools/generate_emu_config/**"
      - "tools/migrate_gse/**"
      - "tools/steamclient_loader/linux/**" # these are just scripts, not built

permissions:
  contents: "write"

jobs:
  emu-win-all:
    name: "win"
    if: ${{ !cancelled() && github.event_name == 'push' }}
    uses: "./.github/workflows/emu-build-all-win.yml"

  emu-linux-all:
    name: "linux"
    if: ${{ !cancelled() && github.event_name == 'push' }}
    uses: "./.github/workflows/emu-build-all-linux.yml"

  emu-win-release:
    name: "win"
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    uses: "./.github/workflows/emu-build-all-win.yml"
    with:
      matrix_prj: '["api_experimental"]'
      matrix_arch: '["x64"]'
      matrix_cfg: '["release"]'
      emu_build_sha: ${{ github.event.pull_request.head.sha }}
      continue_on_error: false

  emu-linux-release:
    name: "linux"
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    uses: "./.github/workflows/emu-build-all-linux.yml"
    with:
      matrix_prj: '["api_experimental"]'
      matrix_arch: '["x64"]'
      matrix_cfg: '["release"]'
      emu_build_sha: ${{ github.event.pull_request.head.sha }}
      continue_on_error: false

  gc-verification:
    name: "gc verification"
    runs-on: "ubuntu-24.04"
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Install required packages"
        shell: "bash"
        run: |
          sudo apt update -y
          sudo apt install -y build-essential python3 protobuf-compiler libprotobuf-dev libcurl4-openssl-dev libmbedtls-dev libopus-dev portaudio19-dev

      - name: "Run full GC verification"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: bash tools/run_gc_verification.sh --full --base-sha "${{ github.event.pull_request.base.sha }}"

  gc-tsan:
    name: "gc thread sanitizer"
    runs-on: "ubuntu-24.04"
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v6

      - name: "Install Clang"
        shell: "bash"
        run: |
          sudo apt update -y
          sudo apt install -y clang

      - name: "Run GC ThreadSanitizer tests"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        env:
          CXX: clang++
        run: bash tools/run_gc_tsan_tests.sh
